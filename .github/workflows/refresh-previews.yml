name: Refresh public game previews

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional game UUID to refresh or remove
        required: false
        type: string
  repository_dispatch:
    types: [refresh-game-preview]
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-public-game-previews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      PREVIEW_OUTPUT_DIR: .
      PREVIEW_GAME_ID: ${{ github.event.client_payload.game_id || inputs.game_id || '' }}
      VITE_SUPABASE_URL: https://thklhhpbfngbeixyqbni.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_VtNFcZoH_Ya-P388iTd-lg_wIDvXnyL

    steps:
      - name: Check out website
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deterministic image renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin fonts-dejavu-core

      - name: Regenerate public previews and sitemap
        run: node scripts/refresh-previews.mjs

      - name: Commit generated files
        run: |
          git config --local user.name "63kitsune"
          git config --local user.email "63kitsune@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add -A -- g previews sitemap.xml robots.txt 404.html
            if git diff --cached --quiet; then
              echo "Previews are already current."
              exit 0
            fi
            git commit -m "chore: refresh public game previews"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not publish previews after three attempts."
              exit 1
            fi
            # Another publisher may have updated main during rendering.
            # Start from that commit and regenerate to avoid binary conflicts.
            git fetch origin main
            git checkout --detach FETCH_HEAD
            node scripts/refresh-previews.mjs
          done
